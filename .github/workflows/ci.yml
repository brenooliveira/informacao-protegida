name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: test
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder-not-a-real-key
      BREACH_PROVIDER: mock
      SUPABASE_SERVICE_ROLE_KEY: ci-supabase-secret-sentinel-do-not-ship
      HIBP_API_KEY: ci-hibp-secret-sentinel-do-not-ship
      RESEND_API_KEY: ci-resend-secret-sentinel-do-not-ship
      CRON_SECRET: ci-cron-secret-sentinel-do-not-ship
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:start
      - run: pnpm db:env
      - run: pnpm db:migrate
      - run: pnpm db:check
      - run: pnpm db:test
      - run: pnpm db:types
      - run: git diff --exit-code -- src/infrastructure/supabase/database.types.ts
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
      - run: pnpm db:stop
        if: always()
